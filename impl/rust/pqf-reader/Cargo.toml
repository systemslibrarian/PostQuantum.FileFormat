[package]
name = "pqf-reader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent Rust reader implementation of the PostQuantum.FileFormat (PQF) v1 specification."
repository = "https://github.com/systemslibrarian/PostQuantum.FileFormat"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pqf-conformance"
path = "src/bin/conformance.rs"

[dependencies]
# Hybrid KEM
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
# ml-kem 0.3 moved KemCore to `kem::Kem`, replaced `EncodedSizeUser` with
# the (deprecated but interop-required) `ExpandedKeyEncoding` trait, and
# moved per-parameter type aliases (Ciphertext, DecapsulationKey) into
# `ml_kem::ml_kem_768`. The 2400-byte FIPS 203 expanded layout that
# BouncyCastle's `MLKemPrivateKeyParameters.GetEncoded()` produces is
# preserved bit-for-bit, so interop still holds; reader.rs uses
# `from_expanded_bytes` rather than the new seed-based init because BC
# does not expose the d||z seed.
ml-kem = "0.3.0"

# Hybrid signatures
ed25519-dalek = { version = "3.0", features = ["alloc"] }
# ml-dsa 0.1 routes the `signature::Verifier::verify` trait method to
# FIPS 204 Algorithm 8 (no domain separator). BouncyCastle's pure
# ML-DSA-87 signs with Algorithm 3 (with the empty-context prefix), so
# the verifier in reader.rs uses `verify_with_context(msg, &[], &sig)`.
ml-dsa = "0.1.0"

# AEAD + hashing + KDF
aes-gcm = "0.10"
sha2 = "0.11"
sha3 = "0.12"   # X-Wing combiner (SHA3-256)
hkdf = "0.13"

# Encoding utilities
base64 = "0.22"
hex = "0.4"

# Manifest deserialization for the conformance binary
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Generic byte / type traits. Pinned to 0.14 because x25519-dalek 2.0
# and aes-gcm 0.10 (both still 2.x stable, not pre-release) hand back
# `GenericArray` values from this version. The newer hybrid-array
# successor crate comes in transitively via sha2 0.11 / hkdf 0.13 /
# sha3 0.12; the two stacks coexist without API friction in our code.
generic-array = "1.4"
typenum = "1.17"

[features]
default = []
