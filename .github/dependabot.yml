version: 2
updates:
  # Runtime/test .NET dependencies. Group non-major bumps into one PR.
  # BouncyCastle and other crypto primitives stay ungrouped so each major
  # bump gets eyes-on review.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dotnet"
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "BouncyCastle*"
      dotnet-major-non-crypto:
        update-types:
          - "major"
        exclude-patterns:
          - "BouncyCastle*"
    ignore:
      # Cryptographic primitives are sensitive. Don't auto-merge majors.
      - dependency-name: "BouncyCastle.Cryptography"
        update-types: ["version-update:semver-major"]

  # Rust second-source reader. Group non-crypto crates; leave the PQ
  # primitives and their core deps ungrouped for manual review.
  - package-ecosystem: "cargo"
    directory: "/impl/rust/pqf-reader"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-non-crypto:
        patterns:
          - "*"
        exclude-patterns:
          # Anything that implements or underpins a cryptographic primitive is
          # excluded so it arrives as its own reviewable PR. A major bump to one
          # of these is never a routine update: x25519-dalek 3.0 and
          # ed25519-dalek 3.0 arrived grouped as "rust-non-crypto" and broke the
          # build outright, because ed25519-dalek 3.0 removed the `std` feature
          # that pqf-reader requests.
          - "ml-kem"
          - "ml-dsa"
          - "hkdf"
          - "sha2"
          - "sha3"
          - "generic-array"
          - "rand_core"
          - "zeroize"
          - "*dalek*"
          - "aes-gcm"
          - "aead"
          - "signature"
          - "digest"

  # GitHub Actions. Safe to group everything.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
