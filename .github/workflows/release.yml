name: Release

# Triggered on a published GitHub release whose tag matches v*.*.*[-preview.*].
# Produces:
#   - The packed CLI nupkg, pushed to NuGet.org.
#   - A CycloneDX SBOM for the CLI, attached to the release.
#   - Sigstore cosign keyless signature (.sig) + certificate (.pem) for the
#     nupkg and SBOM, anchored in the public Rekor transparency log.
#   - SLSA Level 3 build provenance (via slsa-github-generator) for the nupkg
#     and SBOM, attached to the release.
#
# A consumer can verify:
#   cosign verify-blob \
#     --signature   <nupkg>.sig \
#     --certificate <nupkg>.pem \
#     --certificate-identity-regexp 'https://github.com/systemslibrarian/PostQuantum.FileFormat/.+' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     <nupkg>
#
# Secrets required:
#   NUGET_API_KEY — push-only key scoped to PostQuantum.FileFormat.Cli.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build, pack, SBOM, cosign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Sigstore keyless OIDC
    outputs:
      nupkg-name: ${{ steps.pack.outputs.nupkg-name }}
      nupkg-sha256: ${{ steps.hash.outputs.nupkg-sha256 }}
      sbom-sha256: ${{ steps.hash.outputs.sbom-sha256 }}
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PostQuantum.FileFormat.sln

      - name: Build
        run: dotnet build PostQuantum.FileFormat.sln -c Release --no-restore

      - name: Test
        run: dotnet test PostQuantum.FileFormat.sln -c Release --no-build

      - name: Pack CLI
        id: pack
        run: |
          mkdir -p artifacts
          dotnet pack cli/PostQuantum.FileFormat.Cli/PostQuantum.FileFormat.Cli.csproj \
            -c Release --no-build -o artifacts
          NUPKG=$(ls artifacts/*.nupkg | head -n1)
          echo "nupkg-name=$(basename "$NUPKG")" >> "$GITHUB_OUTPUT"

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: |
          ~/.dotnet/tools/dotnet-CycloneDX \
            cli/PostQuantum.FileFormat.Cli/PostQuantum.FileFormat.Cli.csproj \
            --json \
            --output artifacts \
            --filename pqf-cli.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign artifacts with cosign (keyless, OIDC)
        # Keyless signing: cosign requests an OIDC token from the
        # GitHub Actions identity provider, exchanges it for a short-lived
        # X.509 certificate from Fulcio (sigstore CA), signs the blob, and
        # publishes the signature + certificate + log entry to the public
        # Rekor transparency log at https://rekor.sigstore.dev. No
        # long-lived signing key ever exists. A consumer can verify the
        # signature with `cosign verify-blob` against this repository's
        # workflow identity.
        run: |
          cd artifacts
          NUPKG=$(ls *.nupkg | head -n1)
          for f in "$NUPKG" pqf-cli.cdx.json; do
            cosign sign-blob --yes \
              --output-signature   "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
          ls -la

      - name: Compute SHA-256 hashes
        id: hash
        run: |
          cd artifacts
          NUPKG=$(ls *.nupkg | head -n1)
          NUPKG_HASH=$(sha256sum "$NUPKG" | awk '{print $1}')
          SBOM_HASH=$(sha256sum pqf-cli.cdx.json | awk '{print $1}')
          echo "nupkg-sha256=$NUPKG_HASH" >> "$GITHUB_OUTPUT"
          echo "sbom-sha256=$SBOM_HASH"   >> "$GITHUB_OUTPUT"
          # base64-encoded multi-line "sha256  filename" pairs for SLSA generator.
          # SLSA attests the nupkg + SBOM (cosign files are themselves
          # transparency-log anchored, no need to double-attest them).
          HASHES=$(sha256sum "$NUPKG" pqf-cli.cdx.json | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 7

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

  publish:
    name: Publish to NuGet + attach to release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach SBOM + cosign artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd artifacts
          # SBOM
          gh release upload "$TAG" pqf-cli.cdx.json --clobber
          # Sigstore signatures + certificates for the nupkg and SBOM. These
          # let any consumer run `cosign verify-blob` against the public
          # Rekor log without needing the long-lived signing key (there
          # isn't one — keyless OIDC).
          for ext in sig pem; do
            for f in *."$ext"; do
              gh release upload "$TAG" "$f" --clobber
            done
          done
