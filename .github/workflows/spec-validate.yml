name: Spec validate (CDDL)

# Runs the cddl gem against the committed CDDL schema and every
# positive test-vector header. A non-zero exit means either the schema
# is malformed or a committed positive vector's header no longer
# conforms — both are spec-level defects.

on:
  push:
    paths:
      - "spec/**"
      - "test-vectors/**"
      - ".github/workflows/spec-validate.yml"
  pull_request:
    paths:
      - "spec/**"
      - "test-vectors/**"
      - ".github/workflows/spec-validate.yml"

permissions:
  contents: read

jobs:
  cddl:
    name: CDDL schema check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cddl gem
        run: gem install cddl --version "~> 0.11"

      - name: Validate the CDDL schema itself
        run: cddl spec/pqf-header.cddl generate 1 > /dev/null

      - name: Validate every positive vector's header against the CDDL
        # No .NET build needed: a tiny Python script slices out the
        # header bytes from each .pqf using the magic + version + length
        # prefix and hands them to the cddl tool.
        run: |
          set -euo pipefail
          ok=0
          for f in test-vectors/v1/cases/TV-[0-9]*.pqf; do
            header_cbor="$(mktemp)"
            python3 - "$f" "$header_cbor" <<'PY'
          import sys, struct
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as fh:
              fh.seek(6)
              n, = struct.unpack(">I", fh.read(4))
              fh.seek(10)
              body = fh.read(n)
          open(dst, "wb").write(body)
          PY
            cddl spec/pqf-header.cddl validate "$header_cbor" \
              && echo "  OK: $(basename "$f")" \
              || { echo "  FAIL: $(basename "$f")"; ok=1; }
            rm -f "$header_cbor"
          done
          exit $ok
